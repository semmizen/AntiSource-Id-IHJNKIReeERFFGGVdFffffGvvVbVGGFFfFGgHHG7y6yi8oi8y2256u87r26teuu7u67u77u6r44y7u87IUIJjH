<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { border: 2px solid #0f0; border-radius: 10px; padding: 20px; box-shadow: 0 0 15px #0f0; }
        h1 { text-align: center; color: #0f0; text-shadow: 0 0 10px #0f0; }
        #log-display { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; background: #0a0a0a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ANTI-SOURCE C2 PANEL</h1>
        <div id="log-display">Loading evolution logs...</div>
    </div>
    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('logs/evolution.log');
                const text = await response.text();
                document.getElementById('log-display').innerText = text;
            } catch (e) { console.log("Waiting for data..."); }
        }
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
